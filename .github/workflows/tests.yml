name: Tests Cécilia & Manoach

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jeux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Structure (10 chapitres, 30 stages, 70 parties) et images
        run: node test/structure.js
      - name: 210 manches de l histoire, 90 de matières et 28 tables
        run: node test/toutes-les-parties.js
      - name: Écrans, langues, espace parents
        run: npm run test:ecrans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: app/test/out/
